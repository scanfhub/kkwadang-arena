<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>꽈당 아레나</title>
<style>
  :root { --bg:#0e1016; --panel:#191c25; --line:#2a2f3c; --text:#eef0f4; --sub:#8b92a3; --brand:#ffd23f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100vw; height:100vh; }
  #join { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(14,16,22,.82); padding:16px; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px 22px; }
  .card h1 { font-size:26px; font-weight:800; letter-spacing:-.5px; }
  .card h1 b { color:var(--brand); }
  .card p.lead { color:var(--sub); font-size:14px; margin:6px 0 18px; line-height:1.5; }
  .card input { width:100%; font-size:16px; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#10131a; color:var(--text); outline:none; }
  .card input:focus { border-color:var(--brand); }
  .card button { width:100%; margin-top:10px; font-size:16px; font-weight:700; padding:13px; border:0; border-radius:10px; background:var(--brand); color:#1a1400; cursor:pointer; }
  .keys { margin-top:18px; font-size:13px; color:var(--sub); line-height:1.9; }
  .keys kbd { display:inline-block; min-width:22px; text-align:center; padding:1px 6px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; color:var(--text); font-family:inherit; font-size:12px; background:#10131a; }
  #invite { position:fixed; left:12px; top:12px; font-size:13px; padding:7px 11px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; display:none; }
  #invite.ok { border-color:var(--brand); color:var(--brand); }
  #dc { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(14,16,22,.9); font-size:16px; text-align:center; line-height:1.7; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="invite">초대 링크 복사</button>
<div id="join">
  <div class="card">
    <h1>꽈당 <b>아레나</b></h1>
    <p class="lead">상대를 링 밖으로 밀어 떨어뜨리세요. 마지막까지 링 위에 남은 사람이 1점. 링은 점점 줄어듭니다.</p>
    <input id="name" maxlength="10" placeholder="닉네임 (최대 10자)" autocomplete="off">
    <button id="go">입장</button>
    <div class="keys">
      이동 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 또는 방향키<br>
      대시 박치기 <kbd>Space</kbd> — 1.4초마다 한 번<br>
      폰: 왼쪽 화면 드래그로 이동, 오른쪽 화면 탭으로 대시<br>
      노란 아이템 <span style="color:#7be35a">거대화</span>·<span style="color:#ff5a5f">충격파</span>·<span style="color:#c77dff">혼란파</span>(남들 방향키 반대)는 먼저 먹는 사람 것<br>
      판마다 빙판·범퍼·바람·구멍·운석·회전 막대·폭탄·지진 중 몇 가지가 랜덤으로 나와요
    </div>
  </div>
</div>
<div id="dc">서버와 연결이 끊겼어요.<br>새로고침하면 다시 들어갈 수 있어요.</div>
<script src="game-core.js"></script>
<script>
(() => {
const COLORS = ['#ff5a5f','#3ec1ff','#7be35a','#ffb13b','#c77dff','#ff7ac6','#2ee6c5','#f4f1e8'];
const ARENA_R0 = 420, BRAND = '#ffd23f';
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W = 0, H = 0, DPR = 1, narrow = false;
function resize() { narrow = innerWidth < 640; DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
addEventListener('resize', resize); resize();

let ws = null, myId = 0, snaps = [], latest = null;
const feed = [], parts = [], pops = [], trails = [], rings = [];
const bumpFlash = {};
// ---------- 테마 (판마다 방장이 고름: 밤 경기장 / 용암 / 우주 / 눈밭) ----------
const THEME = {
  night: { name: '밤 경기장', bg: '#0e1016', floor: '#1c2130', line: 'rgba(255,255,255,.04)', edge: BRAND, ghost: 'rgba(255,255,255,.08)', spark: '#fff', light: false },
  lava: { name: '용암', bg: '#1c0905', floor: '#2b2422', line: 'rgba(255,140,70,.08)', edge: '#ff7a2f', ghost: 'rgba(255,120,50,.22)', spark: '#ffd9a0', light: false },
  space: { name: '우주', bg: '#04050c', floor: '#1b2234', line: 'rgba(110,210,255,.10)', edge: '#3ec1ff', ghost: 'rgba(110,200,255,.16)', spark: '#dff6ff', light: false },
  snow: { name: '눈밭', bg: '#0a2531', floor: '#cdd9e5', line: 'rgba(30,60,90,.10)', edge: '#ffffff', ghost: 'rgba(255,255,255,.18)', spark: '#2a3a4f', light: true },
};
let theme = THEME.night;
const deco = { // 테마 장식용 고정 난수 (꾸밈이라 사람마다 조금 달라도 됨)
  stars: Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + .4, ph: Math.random() * 6.28 })),
  flakes: Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 2 + 1, v: Math.random() * .04 + .03, ph: Math.random() * 6.28 })),
  blobs: Array.from({ length: 7 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * .18 + .12, ph: Math.random() * 6.28 })),
  cracks: Array.from({ length: 9 }, () => {
    const a = Math.random() * 6.28, d = Math.random() * 330; let x = Math.cos(a) * d, y = Math.sin(a) * d; const pts = [[x, y]];
    for (let k = 0; k < 5; k++) { x += (Math.random() - .5) * 70; y += (Math.random() - .5) * 70; pts.push([x, y]); }
    return pts;
  }),
  specks: Array.from({ length: 160 }, () => { const a = Math.random() * 6.28, d = Math.sqrt(Math.random()) * 420; return [Math.cos(a) * d, Math.sin(a) * d, Math.random() * 2.5 + 1]; }),
};
function drawBackdrop(now) { // 링 바깥 허공 (화면 좌표)
  if (theme === THEME.space) { // 반짝이는 별
    cx.fillStyle = '#fff';
    for (const s of deco.stars) { cx.globalAlpha = .3 + .7 * (.5 + .5 * Math.sin(now / 700 + s.ph)); cx.fillRect(s.x * W, s.y * H, s.s, s.s); }
    cx.globalAlpha = 1;
  } else if (theme === THEME.lava) { // 꿈틀대는 용암 빛
    for (const b of deco.blobs) {
      const x = b.x * W + Math.sin(now / 2300 + b.ph) * 30, y = b.y * H + Math.cos(now / 1900 + b.ph) * 30, r = b.r * Math.max(W, H) * (1 + .08 * Math.sin(now / 900 + b.ph));
      const g = cx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,110,30,.35)'); g.addColorStop(1, 'rgba(255,60,20,0)');
      cx.fillStyle = g; cx.fillRect(x - r, y - r, r * 2, r * 2);
    }
  } else if (theme === THEME.snow) { // 차가운 물결
    cx.strokeStyle = 'rgba(160,220,240,.12)'; cx.lineWidth = 2;
    for (let k = 0; k < 14; k++) {
      const y = ((k * 73 + now * .02) % (H + 40)) - 20;
      cx.beginPath(); for (let x = 0; x <= W; x += 24) cx.lineTo(x, y + Math.sin(x / 60 + now / 900 + k) * 5); cx.stroke();
    }
  }
}
function drawFloorDeco(ar, now) { // 링 바닥 무늬 (월드 좌표, 링 안쪽만)
  if (theme === THEME.night) return;
  cx.save(); cx.beginPath(); cx.arc(0, 0, Math.max(0, ar), 0, 6.283); cx.clip();
  if (theme === THEME.lava) { // 금 간 틈에서 새는 빛
    cx.lineCap = 'round'; cx.lineJoin = 'round';
    for (const pts of deco.cracks) {
      cx.beginPath(); pts.forEach(([x, y], k) => k ? cx.lineTo(x, y) : cx.moveTo(x, y));
      cx.strokeStyle = `rgba(255,120,40,${.35 + .2 * Math.sin(now / 600 + pts[0][0])})`; cx.lineWidth = 5; cx.stroke();
      cx.strokeStyle = 'rgba(255,220,140,.5)'; cx.lineWidth = 1.5; cx.stroke();
    }
  } else if (theme === THEME.space) { // 금속 패널 이음새
    cx.strokeStyle = 'rgba(110,210,255,.07)'; cx.lineWidth = 2; cx.beginPath();
    for (let v = -420; v <= 420; v += 70) { cx.moveTo(v, -420); cx.lineTo(v, 420); cx.moveTo(-420, v); cx.lineTo(420, v); }
    cx.stroke();
    cx.fillStyle = 'rgba(110,210,255,.18)';
    for (let v = -420; v <= 420; v += 70) for (let u = -420; u <= 420; u += 70) cx.fillRect(v - 2, u - 2, 4, 4);
  } else if (theme === THEME.snow) { // 눈 결
    cx.fillStyle = 'rgba(255,255,255,.55)';
    for (const [x, y, r] of deco.specks) { cx.beginPath(); cx.arc(x, y, r, 0, 6.283); cx.fill(); }
  }
  cx.restore();
}
function drawSnowfall(now, dt) { // 눈밭: 화면 위로 내리는 눈
  if (theme !== THEME.snow) return;
  cx.fillStyle = 'rgba(255,255,255,.8)';
  for (const f of deco.flakes) {
    f.y += f.v * dt; if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
    cx.beginPath(); cx.arc((f.x + Math.sin(now / 1200 + f.ph) * .01) * W, f.y * H, f.r, 0, 6.283); cx.fill();
  }
}
const KIND_NAME = { ice: '빙판 지대', bump: '범퍼 기둥', wind: '바람 지대', hole: '낙하 구멍', meteor: '운석 낙하', sweep: '회전 막대', bomb: '폭탄 돌리기', quake: '지진' };
function burst(x, y, n, c, sMin, sMax, life) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = sMin + Math.random() * (sMax - sMin); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, c }); } }
let shake = 0, lastWin = '';
const isTouch = matchMedia('(pointer:coarse)').matches;

// ---------- 사운드 ----------
let ac = null;
function tone(f, dur, type = 'sine', vol = .2, to = null, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol = .3) {
  if (!ac) return;
  const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
  const s = ac.createBufferSource(), g = ac.createGain(); g.gain.value = vol;
  s.buffer = b; s.connect(g).connect(ac.destination); s.start();
}

// ---------- 접속 ----------
function join() {
  const name = $('name').value.trim() || '이름없음';
  try { localStorage.setItem('kd-name', name); } catch (e) {}
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => ws.send(JSON.stringify({ t: 'join', name, canHost: !isTouch }));
  ws.onmessage = ev => onServer(JSON.parse(ev.data));
  ws.onclose = () => { $('dc').style.display = 'flex'; };
  $('join').style.display = 'none'; $('invite').style.display = 'block';
}
try { $('name').value = localStorage.getItem('kd-name') || ''; } catch (e) {}
$('go').onclick = join;
$('name').onkeydown = e => { if (e.key === 'Enter') join(); };
$('invite').onclick = async () => {
  const url = location.origin + '/';
  try { await navigator.clipboard.writeText(url); } catch (e) { prompt('이 주소를 친구에게 보내세요', url); }
  $('invite').textContent = '복사됨 — 친구에게 붙여넣기'; $('invite').classList.add('ok');
  setTimeout(() => { $('invite').textContent = '초대 링크 복사'; $('invite').classList.remove('ok'); }, 2000);
};

function nameOf(i) { const p = latest && latest.p.find(q => q.i === i); return p ? p.n : '?'; }
function colorOf(i) { const p = latest && latest.p.find(q => q.i === i); return p ? COLORS[p.c] : '#fff'; }
function addFeed(parts) { feed.push({ parts, t: performance.now() }); if (feed.length > 6) feed.shift(); }

function onMsg(m) {
  if (m.t === 's') { onState(m); return; }
  if (m.t === 'pong') { const r = performance.now() - m.c; net.rtts.push(r); net.rtt = net.rtt ? net.rtt * .7 + r * .3 : r; return; }
  if (m.t !== 'e') return;
  if (m.k === 'bump') {
    const n = Math.min(24, 4 + m.f / 40);
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = 80 + Math.random() * m.f * .5; parts.push({ x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5, c: theme.spark }); }
    shake = Math.max(shake, Math.min(18, m.f / 45));
    tone(140, .18, 'sine', Math.min(.5, .1 + m.f / 1500), 50); noise(.08, Math.min(.35, m.f / 2000));
  } else if (m.k === 'dash') {
  } else if (m.k === 'fall') {
    tone(700, .6, 'square', .07, 90);
    if (m.practice) addFeed([[m.n, colorOf(m.i)], ['님 연습 중 낙하', '#8b92a3']]);
    else if (m.by) addFeed([[m.bn, colorOf(m.by)], [' 님이 ', '#8b92a3'], [m.n, colorOf(m.i)], [' 님을 떨어뜨림', '#8b92a3']]);
    else addFeed([[m.n, colorOf(m.i)], [m.hole ? ' 님 구멍에 빠짐' : ' 님 혼자 떨어짐', '#8b92a3']]);
  } else if (m.k === 'win') {
    lastWin = m.n;
    [523, 659, 784, 1046].forEach((f, k) => tone(f, .25, 'triangle', .15, null, k * .09));
  } else if (m.k === 'boom') {
    rings.push({ x: m.x, y: m.y, life: .5, L: .5, c: '#ff5a5f', R: 260 }); shake = 22; noise(.4, .5); tone(90, .5, 'sawtooth', .25, 30);
    addFeed([[nameOf(m.i), colorOf(m.i)], [' 님 충격파 발동', '#8b92a3']]);
  } else if (m.k === 'pick') {
    const p = latest && latest.p.find(q => q.i === m.i);
    if (p) pops.push({ i: m.i, text: '거대화!', life: 1.2 });
    tone(300, .3, 'square', .1, 120);
  } else if (m.k === 'bmp') { // 범퍼 기둥에 튕김
    bumpFlash[m.b] = 1; burst(m.x, m.y, 8, '#ff7ac6', 120, 280, .35); tone(990, .07, 'square', .08, 660);
  } else if (m.k === 'conf') { // 혼란파
    rings.push({ x: m.x, y: m.y, life: .6, L: .6, c: '#c77dff', R: 700 });
    addFeed([[m.n, colorOf(m.i)], [' 님 혼란파 발동 — 다들 방향키 반대!', '#c77dff']]);
    tone(520, .5, 'sine', .12, 200); tone(260, .5, 'sine', .1, 520, .06);
  } else if (m.k === 'meteor') {
    rings.push({ x: m.x, y: m.y, life: .35, L: .35, c: '#ffb13b', R: GameCore.MT_R * 1.4 });
    burst(m.x, m.y, 26, '#ffb13b', 100, 500, .5); shake = Math.max(shake, 16); noise(.35, .45); tone(70, .45, 'sawtooth', .22, 30);
  } else if (m.k === 'bomb') {
    tone(m.pass ? 640 : 420, .12, 'square', .1);
    addFeed(m.pass ? [['폭탄이 ', '#8b92a3'], [m.n, colorOf(m.i)], [' 님에게 넘어감', '#8b92a3']]
      : [['폭탄이 ', '#8b92a3'], [m.n, colorOf(m.i)], [' 님에게 붙었다! 부딪혀서 넘기세요', '#8b92a3']]);
  } else if (m.k === 'bombx') {
    rings.push({ x: m.x, y: m.y, life: .5, L: .5, c: '#ff5a5f', R: 300 }); burst(m.x, m.y, 30, '#ff5a5f', 150, 600, .6);
    shake = 24; noise(.5, .55); tone(60, .6, 'sawtooth', .28, 25);
    addFeed([[m.n, colorOf(m.i)], [' 님 폭탄 터짐', '#8b92a3']]);
  } else if (m.k === 'quake') {
    addFeed([['지진이 온다! 곧 한쪽으로 쏠려요', '#ffb13b']]); tone(55, 1.2, 'sawtooth', .15, 40);
  } else if (m.k === 'swh') { // 회전 막대에 맞음
    burst(m.x, m.y, 6, '#cfd3dc', 100, 260, .3); tone(240, .1, 'square', .08, 120);
  } else if (m.k === 'join') addFeed([[m.n, BRAND], [' 님 입장', '#8b92a3']]);
  else if (m.k === 'leave') addFeed([[m.n, '#8b92a3'], [' 님 나감', '#8b92a3']]);
}


// ---------- 연결: 서버(로비·신호·중계) + 방장과 WebRTC P2P(UDP) ----------
const ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
let hostId = 0, isHost = false, worker = null, toHost = null;
const peers = new Map(), members = new Set(); // (방장일 때) 참가자별 WebRTC 연결, 게임 참가자 명단
function wsSend(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function chOpen(c) { return !!(c && c.u && c.r && c.u.readyState === 'open' && c.r.readyState === 'open'); }
function transport() { return isHost ? '방장' : chOpen(toHost) ? 'UDP' : '중계'; }
// 방장에게 보내기: 내가 방장이면 바로 워커로, 직접 연결(UDP)이 열려 있으면 그쪽, 아니면 서버 중계
function sendToHost(m, reliable) {
  if (isHost) { fromClient(myId, m); return; }
  if (chOpen(toHost)) { try { (reliable ? toHost.r : toHost.u).send(JSON.stringify(m)); return; } catch (e) {} }
  wsSend({ t: 'rl', to: hostId, d: m });
}
function sendToClient(id, m, reliable) {
  if (id === myId) { onMsg(m); return; }
  const c = peers.get(id);
  if (chOpen(c)) { try { (reliable ? c.r : c.u).send(JSON.stringify(m)); return; } catch (e) {} }
  wsSend({ t: 'rl', to: id, d: m });
}
function fromClient(id, m) {
  if (!worker || !members.has(id)) return;
  if (m.t === 'in') worker.postMessage({ t: 'in', id, m });
  else if (m.t === 'ping') sendToClient(id, { t: 'pong', c: m.c }, false);
}
function onServer(m) {
  if (m.t === 'welcome') myId = m.id;
  else if (m.t === 'full') alert('방이 꽉 찼어요 (최대 8명). 잠시 후 다시 시도하세요.');
  else if (m.t === 'host') setHost(m.id, m.peers);
  else if (m.t === 'peer-join') { if (isHost) { members.add(m.id); worker.postMessage({ t: 'add', id: m.id, name: m.name }); } }
  else if (m.t === 'peer-leave') {
    if (isHost) { members.delete(m.id); worker.postMessage({ t: 'remove', id: m.id }); const c = peers.get(m.id); if (c) { c.pc.close(); peers.delete(m.id); } }
  }
  else if (m.t === 'sig') onSignal(m.from, m.d);
  else if (m.t === 'rl') { if (isHost) fromClient(m.from, m.d); else if (m.from === hostId) onMsg(m.d); }
}
// 방장이 정해지거나 바뀜: 내가 방장이면 워커에서 새 판을 열고, 아니면 방장에게 WebRTC 연결
function setHost(id, list) {
  if (hostId && id !== hostId) addFeed([['방장이 나가서 새 판을 시작해요', '#8b92a3']]);

    cx.fillStyle = Math.floor(now / 80) % 2 ? '#ffd23f' : '#ff5a5f'; cx.beginPath(); cx.arc(bx + 22, by - 18, 4, 0, 6.283); cx.fill();
    cx.fillStyle = hot ? '#ff5a5f' : '#111'; cx.beginPath(); cx.arc(bx, by, 14, 0, 6.283); cx.fill();
    cx.strokeStyle = '#444'; cx.lineWidth = 2; cx.stroke();
    cx.fillStyle = '#fff'; cx.font = '800 15px -apple-system,sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(Math.ceil(curBomb[1]), bx, by + 1);
  }
  // 대시 쿨다운 (내 캐릭터만)
  if (p.i === myId && p.cd > 0) {
    cx.strokeStyle = BRAND; cx.lineWidth = 4; cx.globalAlpha = .9;
    cx.beginPath(); cx.arc(p.x, p.y, r + 7, -Math.PI / 2, -Math.PI / 2 + 6.283 * (1 - p.cd)); cx.stroke(); cx.globalAlpha = 1;
  }
  // 이름
  cx.font = `700 ${Math.round(14 / sc)}px -apple-system,"Apple SD Gothic Neo",sans-serif`;
  cx.textAlign = 'center'; cx.textBaseline = 'bottom';
  cx.lineWidth = 4 / sc; cx.strokeStyle = 'rgba(0,0,0,.7)';
  const ny = p.y - r - 8 / sc;
  cx.strokeText(p.n, p.x, ny); cx.fillStyle = p.i === myId ? BRAND : '#fff'; cx.fillText(p.n, p.x, ny);
  if (p.cf > 0) { cx.fillStyle = '#c77dff'; cx.font = `800 ${Math.round(18 / sc)}px -apple-system,sans-serif`; cx.textBaseline = 'bottom'; cx.fillText('?', p.x + (p.i === myId ? 18 / sc : 0), ny - 18 / sc); }
  if (p.i === myId) { // 내 위치 표시 삼각형
    const ty = ny - 20 / sc;
    cx.fillStyle = BRAND; cx.beginPath(); cx.moveTo(p.x - 6 / sc, ty - 7 / sc); cx.lineTo(p.x + 6 / sc, ty - 7 / sc); cx.lineTo(p.x, ty); cx.fill();
  }
}

function drawPowerup(u, now, sc) {
  const pulse = 1 + Math.sin(now / 150 + u.i) * .08, R = 16 * pulse;
  cx.save(); cx.translate(u.x, u.y);
  cx.fillStyle = 'rgba(255,210,63,.18)'; cx.beginPath(); cx.arc(0, 0, R + 9, 0, 6.283); cx.fill();
  cx.fillStyle = BRAND; cx.beginPath(); cx.arc(0, 0, R, 0, 6.283); cx.fill();
  cx.strokeStyle = 'rgba(0,0,0,.35)'; cx.lineWidth = 2; cx.stroke();
  cx.strokeStyle = '#1a1400'; cx.fillStyle = '#1a1400'; cx.lineWidth = 3; cx.lineCap = 'round';
  if (u.k === 'big') { // 바깥쪽 화살표 4개 = 커진다
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2 + Math.PI / 4; cx.save(); cx.rotate(a);
      cx.beginPath(); cx.moveTo(2, 0); cx.lineTo(10, 0); cx.moveTo(10, 0); cx.lineTo(6, -4); cx.moveTo(10, 0); cx.lineTo(6, 4); cx.stroke(); cx.restore();
    }
  } else if (u.k === 'conf') { // 소용돌이 = 혼란
    cx.beginPath();
    for (let a = 0; a < 12.6; a += .3) { const rr = 1 + a * .85; cx.lineTo(Math.cos(a + now / 200) * rr, Math.sin(a + now / 200) * rr); }
    cx.stroke();
  } else { // 터지는 별
    cx.beginPath();
    for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8, rr = k % 2 ? 4.5 : 11; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    cx.closePath(); cx.fill();
  }
  cx.restore();
  cx.font = `700 ${Math.round(12 / sc)}px -apple-system,sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'top';
  const lab = u.k === 'big' ? ['거대화', '#7be35a'] : u.k === 'conf' ? ['혼란파', '#c77dff'] : ['충격파', '#ff5a5f'];
  cx.fillStyle = lab[1]; cx.fillText(lab[0], u.x, u.y + R + 6);
}

function drawHUD(st, now) {
  const me = st.p.find(p => p.i === myId);
  const alive = st.p.filter(p => p.s !== 2).length;
  let big = '', small = '', smallCol = '#c3c8d4';
  if (st.ph === 'lobby') { big = st.p.length < 2 ? '친구를 기다리는 중' : '곧 시작'; small = '2명 이상 모이면 라운드 시작 · 지금은 떨어져도 다시 살아나요'; }
  else if (st.ph === 'countdown') {
    big = String(Math.max(1, Math.ceil(st.pt)));
    const ks = (st.mp && st.mp.k || []).map(k => KIND_NAME[k]).filter(Boolean);
    const th = st.mp && THEME[st.mp.th];
    small = ks.length ? '이번 판: ' + [th ? th.name : '', ...ks].filter(Boolean).join(' · ') : '링 밖으로 밀어내세요!';
  }
  else if (st.ph === 'playing') {
    big = `남은 사람 ${alive}명`;
    small = st.ar < 148 ? '서든데스 — 링이 끝까지 줄어듭니다' : st.ar < ARENA_R0 - 2 ? '링이 줄어드는 중' : '대시(Space)로 박치기';
    const mp = st.mp || {}, conf = me && me.s === 0 ? me.cf || 0 : 0;
    if (me && me.s === 2) small = '탈락 — 다음 라운드를 기다리는 중';
    else if (mp.bomb && mp.bomb[0] === myId) { small = `폭탄을 들고 있어요! 부딪혀서 넘기세요 · ${Math.ceil(mp.bomb[1])}초`; smallCol = '#ff5a5f'; }
    else if (conf > 0) { small = `혼란! 방향키가 반대예요 · ${Math.ceil(conf)}초`; smallCol = '#c77dff'; }
    else if (mp.qk && mp.qk[1] > 0) { small = '지진 경고! 곧 한쪽으로 쏠려요'; smallCol = '#ffb13b'; }
    else if (mp.qk && mp.qk[2] > 0) { small = '지진! 화살표 반대쪽으로 버티세요'; smallCol = '#ffb13b'; }
  } else if (st.ph === 'roundover') {
    big = lastWin ? `${lastWin} 승리!` : '무승부';
    small = `${Math.ceil(st.pt)}초 뒤 다음 라운드`;
  }
  cx.textAlign = 'center'; cx.textBaseline = 'top';
  const bs = st.ph === 'countdown' ? 72 : 26;
  cx.font = `800 ${bs}px -apple-system,"Apple SD Gothic Neo",sans-serif`;
  cx.lineWidth = 5; cx.strokeStyle = 'rgba(0,0,0,.6)';
  const by = st.ph === 'countdown' ? H * .5 - 60 : (narrow ? 54 : 16);
  cx.strokeText(big, W / 2, by); cx.fillStyle = st.ph === 'roundover' || st.ph === 'countdown' ? BRAND : '#fff'; cx.fillText(big, W / 2, by);
  cx.font = '500 14px -apple-system,"Apple SD Gothic Neo",sans-serif'; cx.lineWidth = 4;
  cx.strokeText(small, W / 2, by + bs + 6); cx.fillStyle = smallCol; cx.fillText(small, W / 2, by + bs + 6);

  // 점수판
  const rows = [...st.p].sort((a, b) => b.sc - a.sc || b.ko - a.ko);
  const bw = narrow ? W - 24 : 176, rh = 24, bx = narrow ? 12 : W - bw - 12, byy = narrow ? 112 : 12;
  cx.fillStyle = 'rgba(25,28,37,.85)'; cx.strokeStyle = '#2a2f3c'; cx.lineWidth = 1;
  cx.beginPath(); cx.roundRect(bx, byy, bw, 30 + rows.length * rh, 10); cx.fill(); cx.stroke();
  cx.font = '600 11px -apple-system,sans-serif'; cx.fillStyle = '#8b92a3'; cx.textAlign = 'left'; cx.textBaseline = 'middle';
  cx.fillText('이름', bx + 12, byy + 15); cx.textAlign = 'right'; cx.fillText('승', bx + bw - 44, byy + 15); cx.fillText('떨굼', bx + bw - 12, byy + 15);
  rows.forEach((p, k) => {
    const y = byy + 30 + k * rh + rh / 2 - 4;
    cx.globalAlpha = p.s === 2 && st.ph === 'playing' ? .45 : 1;
    cx.fillStyle = COLORS[p.c]; cx.beginPath(); cx.arc(bx + 17, y, 5, 0, 6.283); cx.fill();
    cx.font = `${p.i === myId ? 700 : 500} 13px -apple-system,"Apple SD Gothic Neo",sans-serif`;
    cx.textAlign = 'left'; cx.fillStyle = p.i === myId ? BRAND : '#eef0f4'; cx.fillText(p.n, bx + 28, y);
    cx.textAlign = 'right'; cx.fillStyle = '#eef0f4'; cx.font = '700 13px -apple-system,sans-serif'; cx.fillText(p.sc, bx + bw - 44, y);
    cx.fillStyle = '#8b92a3'; cx.font = '500 13px -apple-system,sans-serif'; cx.fillText(p.ko, bx + bw - 12, y);
    cx.globalAlpha = 1;
  });

  // 킬 피드
  cx.textAlign = 'left'; cx.textBaseline = 'top'; cx.font = '600 13px -apple-system,"Apple SD Gothic Neo",sans-serif';
  const act = feed.filter(f => now - f.t < 6000);
  let fy = narrow ? H - 36 - act.length * 20 : 52;
  for (const f of act) {
    const age = (now - f.t) / 1000;
    cx.globalAlpha = Math.min(1, (6 - age) / 1);
    let fx = 12;
    for (const [txt, col] of f.parts) { cx.lineWidth = 3; cx.strokeStyle = 'rgba(0,0,0,.6)'; cx.strokeText(txt, fx, fy); cx.fillStyle = col; cx.fillText(txt, fx, fy); fx += cx.measureText(txt).width; }
    fy += 20; cx.globalAlpha = 1;
  }

  // 연결 상태: 방장 / UDP 직접 연결 / 서버 중계
  const tr = transport(), ib = $('invite');
  cx.font = '600 12px -apple-system,"Apple SD Gothic Neo",sans-serif'; cx.textAlign = 'left'; cx.textBaseline = 'middle';
  cx.fillStyle = tr === 'UDP' ? '#7be35a' : tr === '중계' ? '#ffb13b' : BRAND;
  cx.fillText(tr === '방장' ? '방장 · 내 브라우저가 게임을 돌리는 중' : (tr === 'UDP' ? 'UDP 직접 연결' : '서버 중계 연결') + (net.rtt ? ` · 핑 ${Math.round(net.rtt)}ms` : ''),
    12 + (ib.offsetWidth || 0) + 10, 12 + (ib.offsetHeight || 30) / 2);

  // 모바일 조이스틱
  if (stick.id !== null) {
    cx.strokeStyle = 'rgba(255,255,255,.3)'; cx.lineWidth = 2; cx.beginPath(); cx.arc(stick.ox, stick.oy, 60, 0, 6.283); cx.stroke();
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, l = Math.hypot(dx, dy), k = l > 60 ? 60 / l : 1;
    cx.fillStyle = 'rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(stick.ox + dx * k, stick.oy + dy * k, 24, 0, 6.283); cx.fill();
  }
  if (isTouch) {
    const r = 42, x = W - r - 24, y = H - r - 30, ready = me && me.cd === 0;
    cx.fillStyle = ready ? 'rgba(255,210,63,.9)' : 'rgba(255,255,255,.15)';
    cx.beginPath(); cx.arc(x, y, r, 0, 6.283); cx.fill();
    cx.fillStyle = ready ? '#1a1400' : '#fff'; cx.font = '800 16px -apple-system,sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('대시', x, y);
  }
}

let lastFrame = performance.now();
function frame(now) {
  const raw = (now - lastFrame) / 1000, dt = Math.min(.05, raw); lastFrame = now; net.frames++;
  simAcc += Math.min(raw, .1) * simRate;
  while (simAcc >= SIM.DT) { simStep(); simAcc -= SIM.DT; }
  const k = Math.exp(-10 * dt); offX *= k; offY *= k;
  renderDelay += (targetDelay() - renderDelay) * Math.min(1, dt * 2);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const st = withPrediction(interp(now));
  theme = (st && st.mp && THEME[st.mp.th]) || THEME.night;
  cx.fillStyle = theme.bg; cx.fillRect(0, 0, W, H);
  drawBackdrop(now);
  if (st) {
    const topPad = narrow ? 112 + 30 + st.p.length * 24 + 14 : 76, botPad = narrow ? (isTouch ? 100 : 16) : 12, avail = H - topPad - botPad;
    const sc = Math.min(W - 24, avail) / (ARENA_R0 * 2 + 40);
    shake *= Math.pow(.02, dt);
    const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
    cx.save(); cx.translate(W / 2 + sx, topPad + avail / 2 + sy); cx.scale(sc, sc);
    // 원래 링 자리 (무너진 영역)
    cx.setLineDash([10, 14]); cx.strokeStyle = theme.ghost; cx.lineWidth = 3;
    cx.beginPath(); cx.arc(0, 0, ARENA_R0, 0, 6.283); cx.stroke(); cx.setLineDash([]);
    // 링
    const ar = st.ar;
    cx.fillStyle = theme.floor; cx.beginPath(); cx.arc(0, 0, Math.max(0, ar), 0, 6.283); cx.fill();
    drawFloorDeco(ar, now);
    cx.strokeStyle = theme.line; cx.lineWidth = 2;
    for (let r = 60; r < ar; r += 60) { cx.beginPath(); cx.arc(0, 0, r, 0, 6.283); cx.stroke(); }
    const shrinking = st.ph === 'playing' && ar < ARENA_R0 - 2 && (ar > 152 || ar < 148);
    const edgeCol = shrinking && Math.floor(now / 250) % 2 ? '#ff5a5f' : theme.edge;
    if (theme !== THEME.night) { cx.globalAlpha = .25; cx.strokeStyle = edgeCol; cx.lineWidth = 18; cx.beginPath(); cx.arc(0, 0, Math.max(0, ar), 0, 6.283); cx.stroke(); cx.globalAlpha = 1; } // 테두리 빛
    cx.strokeStyle = edgeCol; cx.lineWidth = 6;
    cx.beginPath(); cx.arc(0, 0, Math.max(0, ar), 0, 6.283); cx.stroke();
    // 필드·위험 요소
    curBomb = st.mp && st.mp.bomb;
    drawMap(st.mp, now, dt, ar);
    const qk = st.mp && st.mp.qk;
    if (qk && qk[1] <= 0 && qk[2] > 0) { // 지진: 쏠리는 방향 큰 화살표 + 흔들림
      shake = Math.max(shake, 5);
      cx.save(); cx.rotate(qk[0]); cx.globalAlpha = .2; cx.fillStyle = '#ffb13b';
      cx.beginPath(); cx.moveTo(-140, -40); cx.lineTo(60, -40); cx.lineTo(60, -95); cx.lineTo(170, 0); cx.lineTo(60, 95); cx.lineTo(60, 40); cx.lineTo(-140, 40); cx.closePath(); cx.fill();
      cx.restore(); cx.globalAlpha = 1;
    }
    // 파워업
    for (const u of st.u) drawPowerup(u, now, sc);
    // 대시 잔상
    for (const p of st.p) if (p.d && p.s === 0) trails.push({ x: p.x, y: p.y, r: p.r, c: COLORS[p.c], life: .25 });
    for (let k = trails.length - 1; k >= 0; k--) {
      const t = trails[k]; t.life -= dt; if (t.life <= 0) { trails.splice(k, 1); continue; }
      cx.globalAlpha = t.life * 1.6; cx.fillStyle = t.c; cx.beginPath(); cx.arc(t.x, t.y, t.r * (.6 + t.life), 0, 6.283); cx.fill();
    }
    cx.globalAlpha = 1;
    // 플레이어 (떨어지는 사람 먼저)
    const ps = st.p.filter(p => p.s !== 2).sort((a, b) => (b.s - a.s) || (a.y - b.y));
    for (const p of ps) drawPlayer(p, sc, now);
    // 파티클
    for (let k = parts.length - 1; k >= 0; k--) {
      const q = parts[k]; q.life -= dt; if (q.life <= 0) { parts.splice(k, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .9; q.vy *= .9;
      cx.globalAlpha = q.life * 2; cx.fillStyle = q.c; cx.fillRect(q.x - 3, q.y - 3, 6, 6);
    }
    cx.globalAlpha = 1;
    for (let k = rings.length - 1; k >= 0; k--) {
      const g = rings[k]; g.life -= dt; if (g.life <= 0) { rings.splice(k, 1); continue; }
      cx.globalAlpha = g.life / g.L; cx.strokeStyle = g.c; cx.lineWidth = 10;
      cx.beginPath(); cx.arc(g.x, g.y, g.R * (1 - g.life / g.L) + 20, 0, 6.283); cx.stroke();
    }
    cx.globalAlpha = 1;
    for (let k = pops.length - 1; k >= 0; k--) {
      const o = pops[k]; o.life -= dt; if (o.life <= 0) { pops.splice(k, 1); continue; }
      const p = st.p.find(q => q.i === o.i); if (!p) continue;
      cx.globalAlpha = Math.min(1, o.life * 2); cx.font = `800 ${Math.round(18 / sc)}px -apple-system,sans-serif`;
      cx.textAlign = 'center'; cx.fillStyle = '#7be35a'; cx.fillText(o.text, p.x, p.y - p.r - 40 / sc - (1.2 - o.life) * 30);
    }
    cx.globalAlpha = 1;
    cx.restore();
    drawSnowfall(now, dt);
    drawHUD(st, now);
  } else if (ws) {
    cx.fillStyle = '#8b92a3'; cx.font = '500 15px -apple-system,sans-serif'; cx.textAlign = 'center'; cx.fillText('연결 중…', W / 2, H / 2);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
